name: Deploy to Cloudflare Workers

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A pull request gets its own group keyed by ref, so a validate run never queues in front of a
# production deploy and a new push supersedes its own earlier run. Production deploys keep the
# single shared group and are never cancelled mid-flight.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-validate-{0}', github.ref) || 'production-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Reject incomplete production configuration
        run: |
          ! grep -q 'REPLACE-ME\|REPLACE_WITH_ACCESS' wrangler.jsonc
      - run: just ci
      - run: bun run build
      - run: bunx wrangler deploy --dry-run

  deploy:
    # Without this guard, adding the pull_request trigger above would deploy every pull request
    # straight to production.
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Deploy Worker and static site
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Install browser for production checks
        run: bunx playwright install --with-deps chromium
      - name: Verify production Turnstile state recovery
        run: bun run test:live
