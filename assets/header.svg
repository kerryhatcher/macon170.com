      <stop offset="0%" stop-color="#003F87"/>
      <stop offset="100%" stop-color="#002B5C"/>
    </linearGradient>
    <pattern id="ruleLines" width="1200" height="34" patternUnits="userSpaceOnUse">
      <line x1="0" y1="33.5" x2="1200" y2="33.5" stroke="#D7CDB8" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- notebook-paper background -->
  <rect width="1200" height="300" fill="#F7F1E3"/>
  <rect width="1200" height="300" fill="url(#ruleLines)"/>
  <line x1="86" y1="0" x2="86" y2="300" stroke="#A33C34" stroke-width="2" opacity="0.4"/>

  <!-- decorative trail: dotted path with small pine markers -->
  <g opacity="0.5">
