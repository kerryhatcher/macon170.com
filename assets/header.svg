<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="headerTitle">
  <title id="headerTitle">Pack 170 — Cub Scouts of Macon, Georgia — macon170.com website source</title>
  <defs>
