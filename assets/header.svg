    <g fill="#42765C">
      <path d="M955 225 l7 11 l-4 0 l6 9 l-18 0 l6 -9 l-4 0 Z"/>
      <path d="M1080 140 l6 9 l-3 0 l5 8 l-15 0 l5 -8 l-3 0 Z"/>
      <path d="M1145 95 l5 8 l-3 0 l4 6 l-12 0 l4 -6 l-3 0 Z"/>
    </g>
  </g>

  <!-- badge medallion -->
  <g transform="translate(150,90)">
