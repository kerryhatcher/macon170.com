    <text x="0" y="185" font-size="24" font-weight="700" fill="#28543F">Cub Scouts of Macon, Georgia</text>
    <text x="0" y="218" font-size="16" font-weight="600" fill="#59636B" letter-spacing="0.3" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif">Astro + Cloudflare Workers source for macon170.com</text>
