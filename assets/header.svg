    <circle cx="60" cy="60" r="60" fill="none" stroke="#FCD116" stroke-width="4"/>
    <g stroke="#FCD116" stroke-width="2.5" stroke-linecap="round">
      <line x1="60" y1="10" x2="60" y2="19"/>
      <line x1="60" y1="101" x2="60" y2="110"/>
      <line x1="10" y1="60" x2="19" y2="60"/>
      <line x1="101" y1="60" x2="110" y2="60"/>
