<svg width="320" height="88" viewBox="0 0 320 88" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Pack 170 — macon170.com</title>
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003F87"/>
      <stop offset="100%" stop-color="#002B5C"/>
    </linearGradient>
  </defs>

  <!-- Icon: original trail-marker compass + pine badge (no official Scouting emblems used) -->
  <g transform="translate(4,4)">
    <circle cx="40" cy="40" r="40" fill="url(#badgeGrad)"/>
    <circle cx="40" cy="40" r="40" fill="none" stroke="#FCD116" stroke-width="3"/>

    <!-- compass ticks -->
    <g stroke="#FCD116" stroke-width="2" stroke-linecap="round">
      <line x1="40" y1="8" x2="40" y2="14"/>
      <line x1="40" y1="66" x2="40" y2="72"/>
      <line x1="8" y1="40" x2="14" y2="40"/>
      <line x1="66" y1="40" x2="72" y2="40"/>
    </g>

    <!-- pine tree silhouette -->
    <g fill="#F7F1E3">
      <path d="M40 20 L49 33 L44 33 L52 44 L46 44 L55 55 L25 55 L34 44 L28 44 L36 33 L31 33 Z"/>
      <rect x="37.5" y="55" width="5" height="7" rx="1"/>
    </g>

    <!-- compass needle accent -->
    <path d="M40 40 L44 26 L40 30 L36 26 Z" fill="#E8A3C6" opacity="0.85"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(96,0)" font-family="Montserrat, 'Segoe UI', system-ui, sans-serif">
    <text x="0" y="42" font-size="30" font-weight="800" fill="#003F87" letter-spacing="-0.5">Pack 170</text>
    <text x="0" y="64" font-size="14" font-weight="600" fill="#59636B" letter-spacing="0.5">macon170.com</text>
  </g>
</svg>
